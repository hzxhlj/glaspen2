name: windows-build

# 云端出产物: 本机没有 Windows 上的 Rust/Flutter 工具链时, 用这条流水线编译
# 并下载可直接运行的 Windows 包(exe + dll + 自带 cairo)。
#
# 触发: 任何分支的 push(便于在 fork 上验证改动), 或手动 Run workflow。
# 注意: fork 首次使用需在 Actions 页点一次
# "I understand my workflows, go ahead and enable them"。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: winbuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt

      # chat/build.rs 用 tonic_build::compile_protos, 需要 protoc
      - name: Ensure protoc
        shell: pwsh
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc -y --no-progress
            "$env:CHOCOLATEYINSTALL\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          protoc --version

      # 格式化检查只做提示: 失败不影响出包, 日志里能拿到 rustfmt 的 diff 用来回灌
      - name: rustfmt (仅提示)
        continue-on-error: true
        shell: bash
        run: |
          cargo fmt
          echo "--- rustfmt 改动 ---"
          git --no-pager diff --stat
          git --no-pager diff

      # 笔迹几何单测(纯数学, 不依赖 cairo DLL): 细分/轮廓的正确性在这里验
      - name: cargo test (inkgeom)
        shell: bash
        run: |
          cargo test -p glaspen-core inkgeom:: -- --nocapture 2>&1 | tail -40
          exit ${PIPESTATUS[0]}

      # 设置面板(Flutter)可选: 失败也只是没有面板, 不影响笔迹本体出包
      - name: Build Flutter settings (optional)
        id: flutter
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: flutter build windows (optional)
        continue-on-error: true
        working-directory: flutter_settings
        run: flutter build windows --release

      - name: cargo build --release
        shell: bash
        run: |
          cargo build --release 2>&1 | tail -60
          exit ${PIPESTATUS[0]}

      - name: 组装产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/glaspen2.exe dist/
          if (Test-Path target/release/glaspen2.dll) { Copy-Item target/release/glaspen2.dll dist/ }
          # build.rs 已把 vendor/win/cairo 的 DLL 拷到 target/release, 一并收走
          Get-ChildItem target/release/*.dll |
            Where-Object { $_.Name -ne 'glaspen2.dll' } |
            Copy-Item -Destination dist/ -ErrorAction SilentlyContinue
          $flutter = "flutter_settings/build/windows/x64/runner/Release"
          if (Test-Path "$flutter/glaspen2_settings.exe") {
            Copy-Item "$flutter/glaspen2_settings.exe" dist/
            Copy-Item "$flutter/flutter_windows.dll" dist/ -ErrorAction SilentlyContinue
            if (Test-Path "$flutter/data") { Copy-Item "$flutter/data" -Destination dist/data -Recurse }
            "flutter settings: 已打包"
          } else {
            "flutter settings: 未构建(仅无面板, 笔迹功能不受影响)"
          }
          Copy-Item README.md, LICENSE dist/ -ErrorAction SilentlyContinue
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: glaspen2-windows-x64
          path: dist/**
          if-no-files-found: error
